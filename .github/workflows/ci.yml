name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  changeset-presence:
    name: Require a CLI patch Changeset
    if: >-
      github.event_name == 'pull_request' &&
      !(
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'changeset-release/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the complete pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install Changesets parser without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Check releasable CLI paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run changeset:check

  npm-quality:
    name: npm quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

  npm-package-smoke:
    name: npm package smoke and pack (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm package dry run
        run: npm run pack:check

      - name: Create npm package tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --workspace @abijith-suresh/planview --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          tarball="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { npmPackFilename } from "./scripts/npm-pack-result.mjs";
            console.log(npmPackFilename(JSON.parse(readFileSync(process.argv[1], "utf8"))));
          ' "$RUNNER_TEMP/pack.json")"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke test packed npm package
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/planview-smoke"
          npm install --global --prefix "$install_dir" --ignore-scripts "$TARBALL"
          "$install_dir/bin/plansplease" --help
          "$install_dir/bin/plansplease" --version
          skills_project="$RUNNER_TEMP/planview-skills-project"
          mkdir -p "$skills_project"
          cd "$skills_project"
          DISABLE_TELEMETRY=1 DO_NOT_TRACK=1 npx --yes skills add "$GITHUB_WORKSPACE/apps/cli/skills" -a codex -y --copy
          test -f "$skills_project/.agents/skills/planview/SKILL.md"
          test -f "$skills_project/.agents/skills/create-html/SKILL.md"
          test -f "$skills_project/.agents/skills/create-html/references/browser-native-patterns.md"


      - name: Test installed legacy upload and keyed protocol against local fixtures
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run test:upload:installed

      - name: Install Chromium for the installed manager browser smoke
        run: npx playwright install --with-deps chromium

      - name: Test the installed manager in Chromium
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/manager-browser-smoke.mjs

  cross-platform-packed-smoke:
    name: packed CLI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Pack from clean build outputs and run CLI lifecycle smoke
        run: node scripts/cross-platform-smoke.mjs

      - name: Test cloud CLI flow
        run: node --test apps/cli/test/cloud.test.mts
